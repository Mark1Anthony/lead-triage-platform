kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lead-triage

networking:
  # kindnet, the default, does not enforce NetworkPolicy the way a production
  # CNI does - a correct policy was silently dropping the ingress controller's
  # traffic. Calico is installed instead, so the policies in charts/ are really
  # enforced here and the pipeline tests them rather than only rendering them.
  # It is also what the AKS design uses.
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"

nodes:
  - role: control-plane
    # The ingress controller only schedules onto a node carrying this label,
    # and the two port mappings are what let it be reached from the host at all
    # - kind runs the cluster inside Docker, so nothing is published otherwise.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  # Two workers so the topology spread constraint and the disruption budget
  # have something real to act on. A single-node cluster would satisfy both
  # trivially and prove nothing.
  - role: worker
  - role: worker
