kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lead-triage

nodes:
  - role: control-plane
    # The ingress controller only schedules onto a node carrying this label,
    # and the two port mappings are what let it be reached from the host at all
    # - kind runs the cluster inside Docker, so nothing is published otherwise.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  # Two workers so the topology spread constraint and the disruption budget
  # have something real to act on. A single-node cluster would satisfy both
  # trivially and prove nothing.
  - role: worker
  - role: worker
