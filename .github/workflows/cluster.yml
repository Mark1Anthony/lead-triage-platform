name: Cluster

# Builds the image, brings up a real Kubernetes cluster, deploys the platform
# with Terraform and checks it actually serves traffic - then tears it down.
# Everything here runs on GitHub's free runners; no cloud resources are created.

# The workflow token needs to read this repository and nothing else. Left
# unset it inherits write access to everything the repository has, which is
# more than any job here uses.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # The application lives in its own repository. Building it here rather
      # than pulling a published tag means a change to either repo is tested
      # against the current state of the other.
      - name: Check out the application
        uses: actions/checkout@v4
        with:
          repository: Mark1Anthony/lead-triage
          path: app

      - name: Create the cluster
        uses: helm/kind-action@v1
        with:
          config: kind/cluster.yaml
          cluster_name: lead-triage

      - name: Install the ingress controller
        run: |
          # Pinned to a release rather than main: a manifest from a moving
          # branch makes every run depend on what upstream merged that morning.
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.13.0/deploy/static/provider/kind/deploy.yaml

          # rollout status rather than waiting on a pod condition: the admission
          # webhook jobs run first and the controller image is large, so on a
          # cold runner this takes longer than the 180s it used to be given -
          # which is how this step failed once with nothing wrong.
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=300s

          # Ready is still not serving. The webhook has to be reachable before
          # an Ingress can be admitted at all.
          kubectl -n ingress-nginx wait --for=condition=complete job \
            --selector=app.kubernetes.io/component=admission-webhook --timeout=180s

      - name: Build the image and load it into the cluster
        run: |
          docker build -t lead-triage:ci ./app
          # kind nodes have their own image store; without this the pods would
          # try to pull from a registry and fail.
          kind load docker-image lead-triage:ci --name lead-triage

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Deploy
        working-directory: terraform/cluster
        run: |
          terraform init -input=false
          # Network policies stay on. They were switched off here after a run
          # where deleting them appeared to fix the ingress path - but that test
          # also waited ten seconds, and the controller turning out to be slow
          # to become ready makes the wait the likelier explanation. This run
          # decides it.
          terraform apply -auto-approve -input=false \
            -var 'image_repository=lead-triage' \
            -var 'image_tag=ci' \

      - name: The service answers, on Postgres
        run: |
          # The controller picks up endpoints asynchronously after the release
          # lands, so wait for them rather than racing them.
          for i in $(seq 1 30); do
            [ -n "$(kubectl -n lead-triage get endpointslice -l kubernetes.io/service-name=lead-triage -o jsonpath='{.items[*].endpoints[*].addresses[0]}')" ] && break
            sleep 2
          done

          # Retries have to survive a reset, not only a refusal: this job failed
          # twice that way on code that then passed twice unchanged.
          for i in $(seq 1 45); do
            health=$(curl -fsS -m 5 -H 'Host: lead-triage.localtest.me' http://localhost/health) && break
            sleep 4
          done
          echo "$health"
          echo "$health" | grep -q '"database":"postgres"' \
            || { echo "expected postgres; the secret never reached the pod"; exit 1; }

      - name: The dashboard renders and the seed ran
        run: |
          curl -fsS -H 'Host: lead-triage.localtest.me' http://localhost/ \
            | grep -q "Nord Capital" \
            || { echo "seed rows missing"; exit 1; }

      - name: Writes are closed without the token
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
            -H 'Host: lead-triage.localtest.me' http://localhost/leads/1)
          [ "$code" = "401" ] || { echo "expected 401, got $code"; exit 1; }

      - name: The token Terraform generated is the one that works
        working-directory: terraform/cluster
        run: |
          token=$(terraform output -raw api_token)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "X-Api-Token: $token" -H 'Host: lead-triage.localtest.me' \
            http://localhost/api/leads)
          [ "$code" = "200" ] || { echo "expected 200 with the token, got $code"; exit 1; }

      - name: Rolling update keeps serving
        run: |
          kubectl -n lead-triage rollout restart deployment/lead-triage
          kubectl -n lead-triage rollout status deployment/lead-triage --timeout=180s
          curl -fsS -H 'Host: lead-triage.localtest.me' http://localhost/health > /dev/null \
            || { echo "the service did not survive a restart"; exit 1; }

      - name: What went wrong
        if: failure()
        run: |
          echo "== workloads"
          kubectl -n lead-triage get pods,svc,ingress -o wide
          kubectl -n lead-triage logs -l app.kubernetes.io/name=lead-triage --tail=40 || true
          kubectl -n lead-triage logs -l app.kubernetes.io/name=postgres --tail=20 || true

          echo "== network policies and the labels they select on"
          kubectl -n lead-triage get networkpolicy -o yaml
          kubectl get ns --show-labels

          echo "== ingress controller"
          kubectl -n ingress-nginx get pods -o wide
          kubectl -n ingress-nginx logs -l app.kubernetes.io/component=controller --tail=40 || true

          # Reaching the service from inside the namespace separates a blocked
          # ingress controller from an application that is not serving at all.
          echo "== from inside the cluster"
          kubectl -n lead-triage run probe --rm -i --restart=Never --image=curlimages/curl:8.10.1 --command -- curl -sS -m 10 -o /dev/null -w 'in-namespace=%{http_code}' http://lead-triage/health || true
          echo

          # And once more with the policies out of the way. If this succeeds
          # where the health check did not, the policy is the answer.
          echo "== with the policies removed"
          kubectl -n lead-triage delete networkpolicy --all
          sleep 10
          curl -sS -m 10 -o /dev/null -w 'through-ingress=%{http_code}' -H 'Host: lead-triage.localtest.me' http://localhost/health || true
          echo

      - name: Tear down
        if: always()
        working-directory: terraform/cluster
        run: terraform destroy -auto-approve -input=false || true
