apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lead-triage.fullname" . }}
  labels:
    {{- include "lead-triage.labels" . | nindent 4 }}
data:
  # Names match what the application reads from the environment.
  LEAD_TRIAGE_MODE: {{ .Values.config.mode | quote }}
  OPENAI_MODEL: {{ .Values.config.openaiModel | quote }}
