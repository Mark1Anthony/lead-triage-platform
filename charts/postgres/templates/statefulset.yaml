apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    checkov.io/skip1: CKV_K8S_11=Burst capacity matters more than a ceiling for a database; memory is capped instead.
    checkov.io/skip2: CKV_K8S_15=Deployed by an immutable tag.
    checkov.io/skip3: CKV_K8S_21=Namespace comes from Terraform.
    checkov.io/skip4: CKV_K8S_35=POSTGRES_PASSWORD is read from the environment by the official image; it has no file-based equivalent.
    checkov.io/skip5: CKV_K8S_40=uid 70 is the postgres user baked into the image, and the data directory is owned by it.
    checkov.io/skip6: CKV_K8S_43=Deployed by tag; see the application chart.
spec:
  serviceName: {{ .Release.Name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # A database has no reason to talk to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # postgres in the alpine image
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.secretKey }}
            # From 18 on these images keep the cluster in a version-specific
            # subdirectory, so the mount goes one level up from the old path.
            - name: PGDATA
              value: /var/lib/postgresql/{{ .Values.image.tag | splitList "-" | first }}/docker
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.auth.username | quote }}, "-d", {{ .Values.auth.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.auth.username | quote }}, "-d", {{ .Values.auth.database | quote }}]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            # With the root filesystem read-only, the two directories Postgres
            # writes outside its data directory need mounts of their own: the
            # unix socket, and scratch space for sorts that exceed work_mem.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
